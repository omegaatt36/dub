version: '3'

vars:
  APP_NAME: dub
  BIN_DIR: bin
  MACOS_MIN_VERSION: "13.0"
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  default:
    cmds:
      - task: fmt
      - task: check
      - task: test
  fmt:
    cmds:
      - go tool golangci-lint fmt
      - go mod tidy
  check:
    cmds:
      - go vet -all ./...
      - go tool golangci-lint run
      - go tool govulncheck ./...
  test:
    cmds:
      - go test -race ./...
  generate:
    desc: Generate templ files and build the frontend assets
    cmds:
      - task: common:build:frontend
  dev:
    desc: Run the app with templ and Tailwind watchers
    deps: [generate]
    # --minify has to match the css task. The watcher writes the same committed
    # file the build writes, so without it `task dev` leaves an unminified
    # app.css in the working tree and the next build shows a whole-file diff.
    cmds:
      - go tool templ generate -watch & ./tailwindcss -i web/static/css/input.css -o web/static/css/app.css --minify --watch & go run .
  build:
    desc: Build the application
    cmds:
      - task: "{{.GOOS}}:build"
  package:
    desc: Package a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
  run:
    desc: Run the built application
    cmds:
      - task: "{{.GOOS}}:run"
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
