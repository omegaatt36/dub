version: "2"
run:
  issues-exit-code: 1
  relative-path-mode: gomod
  tests: true
  go: "1.27"
linters:
  enable:
    - copyloopvar
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: github.com/omegaatt36/dub
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/omegaatt36/dub
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/omegaatt36/dub)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
output:
  formats:
    json:
      path: stdout
  show-stats: false
