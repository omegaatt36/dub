name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/amd64
          - os: macos-latest
            platform: darwin/arm64
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build and package (Darwin)
        if: startsWith(matrix.platform, 'darwin')
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH##*/}"

          wails3 package GOOS=darwin GOARCH="$ARCH"
          mv bin/Dub.dmg "Dub-darwin-${ARCH}.dmg"

      - name: Build and package (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH##*/}"

          wails3 package GOOS=linux GOARCH="$ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dub-${{ matrix.platform == 'darwin/amd64' && 'darwin-amd64' || matrix.platform == 'darwin/arm64' && 'darwin-arm64' || matrix.platform == 'linux/amd64' && 'linux-amd64' || 'linux-arm64' }}
          path: Dub-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.dmg
            *.tar.gz
