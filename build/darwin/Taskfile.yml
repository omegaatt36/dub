version: '3'

includes:
  common: ../Taskfile.yml

vars:
  BUNDLE_NAME: Dub

tasks:
  build:
    summary: Builds the application for macOS
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_MIN_VERSION}}"
      MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_MIN_VERSION}}"

  package:
    summary: Packages the application into a `.dmg`
    deps:
      - task: build
    cmds:
      - task: create:app:bundle
      - task: create:dmg

  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"

  create:dmg:
    summary: Creates a `.dmg` from the `.app` bundle
    cmds:
      - wails3 tool package -format dmg -name "{{.BUNDLE_NAME}}" -out "{{.BIN_DIR}}"

  run:
    summary: Runs the application
    deps:
      - task: build
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
