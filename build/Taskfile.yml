version: '3'

vars:
  HTMX_VERSION: 4.0.0
  TAILWIND_VERSION: v4.2.1
  SED_INPLACE:
    sh: "if sed --version >/dev/null 2>&1; then echo \"sed -i\"; else echo \"sed -i ''\"; fi"

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Multi-arch builds invoke this concurrently from parallel deps; two
    # `go mod tidy` processes racing on go.mod can corrupt it.
    run: once
    cmds:
      - go mod tidy

  generate:
    summary: Generate templ files and build the frontend assets
    deps:
      - task: templ
      - task: css
      - task: htmx

  build:frontend:
    summary: Generate templ files and build the frontend assets
    cmds:
      - task: generate

  templ:
    summary: Generate templ files
    cmds:
      - go tool templ generate

  css:
    summary: Build Tailwind CSS
    deps:
      - task: install:tailwind
    cmds:
      - ./tailwindcss -i web/static/css/input.css -o web/static/css/app.css --minify
    sources:
      - web/static/css/input.css
      - web/template/**/*.templ
      - web/index.html
    generates:
      - web/static/css/app.css

  install:tailwind:
    summary: Download the Tailwind CSS standalone CLI to ./tailwindcss
    status:
      - test -x tailwindcss
    cmds:
      - |
        set -eu
        case "$(uname -s)/$(uname -m)" in
          Darwin/arm64)     asset=tailwindcss-macos-arm64 ;;
          Darwin/x86_64)    asset=tailwindcss-macos-x64 ;;
          Linux/aarch64|Linux/arm64) asset=tailwindcss-linux-arm64 ;;
          Linux/x86_64)     asset=tailwindcss-linux-x64 ;;
          *) echo "unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
        esac
        echo "Downloading {{.TAILWIND_VERSION}} ($asset)"
        curl -fsSL "https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/$asset" -o tailwindcss
        chmod +x tailwindcss

  htmx:
    summary: Vendor htmx.min.js (pinned version)
    cmds:
      - curl -fsSL https://unpkg.com/htmx.org@{{.HTMX_VERSION}}/dist/htmx.min.js -o web/static/js/htmx.min.js

  generate:icons:
    summary: Generate the macOS .icns from build/appicon.png
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
    cmds:
      - mkdir -p windows
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name Dub -binaryname dub -config config.yml -dir .
      - '{{.SED_INPLACE}} "/LSMinimumSystemVersion/{n;s|<string>.*</string>|<string>{{.MACOS_MIN_VERSION}}.0</string>|;}" darwin/Info.plist darwin/Info.dev.plist'
      - grep -A1 LSMinimumSystemVersion darwin/Info.plist darwin/Info.dev.plist
